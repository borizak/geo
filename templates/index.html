<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>GPS Satellites</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
  <style>
    html,body,#cesium { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #controls { position:fixed; top:10px; left:10px; z-index:10; display:flex; flex-direction:column; gap:6px; }
    .btn { background:rgba(0,0,0,0.7); color:#0df; border:1px solid rgba(0,220,255,0.3);
           padding:6px 14px; border-radius:6px; cursor:pointer; font:13px monospace; white-space:nowrap; }
    .btn.on  { background:rgba(0,120,180,0.5); border-color:#0df; }
    .btn.dim { opacity:0.35; cursor:default; }
    #tip { position:fixed; background:rgba(0,0,0,0.88); color:#0df; padding:10px 14px;
           border-radius:6px; font:12px monospace; pointer-events:none; display:none;
           z-index:20; border:1px solid rgba(0,220,255,0.4); line-height:1.6; }
    #pulsePnl { position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.88); color:#ff0;
                padding:10px 16px; border-radius:8px; font:13px monospace; display:none;
                z-index:20; border:1px solid rgba(255,220,0,0.5); line-height:1.6; }
    #scaleTxt { position:fixed; top:0; left:0; right:0; background:rgba(180,0,0,0.9);
                color:#fff; text-align:center; font:bold 13px monospace; padding:5px 0;
                z-index:30; pointer-events:none; display:none; letter-spacing:1px; }
  </style>
</head>
<body>
<div id="cesium"></div>
<div id="scaleTxt">⚠ TRUE SCALE MODE &nbsp;|&nbsp; Drag = orbit around satellite &nbsp;&nbsp; Scroll = zoom</div>
<div id="controls">
  <button class="btn" id="btnHover"     onclick="toggleHover()">🛰 Altitude on hover</button>
  <button class="btn" id="btnTether"    onclick="toggleTethers()">📏 Tether to ground</button>
  <button class="btn" id="btnPulse"     onclick="togglePulse()">⚡ Signal pulse</button>
  <button class="btn" id="btnISS"       onclick="toggleISS()">🚀 Show ISS</button>
  <button class="btn" id="btnCoverage"  onclick="toggleCoverage()">🔵 Coverage cones</button>
  <button class="btn dim" id="btnTrueScale" onclick="toggleTrueScale()">🔭 True scale</button>
</div>
<div id="tip"></div>
<div id="pulsePnl"></div>
<script>
  Cesium.Ion.defaultAccessToken = "{{ cesium_token }}";
  const viewer = new Cesium.Viewer("cesium", {
    shouldAnimate: true, baseLayerPicker: false,
    infoBox: false, selectionIndicator: false,
  });

  // ── State ──────────────────────────────────────────────────────────────────
  let satDS, selectedEntity = null;
  let hoverOn = false, tethersOn = false;
  let pulseOn = false, issOn = false, coverageOn = false, trueScaleOn = false;
  let pulseLineEntity = null;
  let satBoxEntity = null, savedCamPos = null, savedCamOrient = null;

  // Orbit-camera state (spherical coords relative to satellite's local frame)
  let camAzimuth   = 0;            // angle around the satellite's "up" (radial) axis
  let camElevation = Math.PI / 4;  // elevation above the satellite's horizontal plane
  let camDist      = 15;           // metres from satellite centre

  let mouseDown = false, lastMouseX = 0, lastMouseY = 0;

  const satEntities      = [];
  const tetherEntities   = [];
  const coverageEntities = [];
  const COVERAGE_RADIUS  = 8462e3;
  const tip              = document.getElementById('tip');
  const pulsePnl         = document.getElementById('pulsePnl');
  const ctrl             = viewer.scene.screenSpaceCameraController;

  // ── Helpers ────────────────────────────────────────────────────────────────
  // Compute the satellite's local reference frame at a given ECEF position.
  // Returns: up = radial (away from Earth), east, north (tangential)
  function satLocalFrame(satPos) {
    const up = Cesium.Cartesian3.normalize(satPos, new Cesium.Cartesian3());
    let east = Cesium.Cartesian3.cross(Cesium.Cartesian3.UNIT_Z, up, new Cesium.Cartesian3());
    if (Cesium.Cartesian3.magnitude(east) < 1e-6)
      Cesium.Cartesian3.clone(Cesium.Cartesian3.UNIT_X, east);
    Cesium.Cartesian3.normalize(east, east);
    const north = Cesium.Cartesian3.cross(up, east, new Cesium.Cartesian3());
    return { up, east, north };
  }

  // Transform a vector given in local (east, north, up) components to ECEF.
  function localToECEF(le, ln, lu, frame) {
    return new Cesium.Cartesian3(
      frame.east.x * le + frame.north.x * ln + frame.up.x * lu,
      frame.east.y * le + frame.north.y * ln + frame.up.y * lu,
      frame.east.z * le + frame.north.z * ln + frame.up.z * lu
    );
  }

  // ── Central refresh ────────────────────────────────────────────────────────
  function refreshFeatures() {
    document.getElementById('btnTrueScale').classList.toggle('dim', !selectedEntity);
    if (!selectedEntity && trueScaleOn) exitTrueScale();

    satEntities.forEach((sat, i) => {
      const isSel      = sat === selectedEntity;
      const passFilter = !selectedEntity || isSel;
      tetherEntities[i].show   = tethersOn  && passFilter;
      coverageEntities[i].show = coverageOn && passFilter;
      if (sat.point) {
        sat.point.color     = new Cesium.ConstantProperty(
          isSel ? Cesium.Color.YELLOW : Cesium.Color.fromCssColorString('#00dcff'));
        sat.point.pixelSize = new Cesium.ConstantProperty(isSel ? 10 : 6);
      }
    });

    if (pulseLineEntity) { viewer.entities.remove(pulseLineEntity); pulseLineEntity = null; }
    if (pulseOn && selectedEntity) {
      const sat = selectedEntity;
      pulseLineEntity = viewer.entities.add({
        polyline: {
          positions: new Cesium.CallbackProperty(t => {
            const pos = sat.position.getValue(t);
            if (!pos) return [];
            const c = Cesium.Cartographic.fromCartesian(pos);
            return [pos, Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, 0)];
          }, false),
          width: 2,
          material: new Cesium.PolylineGlowMaterialProperty({
            glowPower: 0.3, color: Cesium.Color.YELLOW }),
        }
      });
    }

    if (!selectedEntity || !pulseOn) pulsePnl.style.display = 'none';
    if (!selectedEntity || !hoverOn) tip.style.display = 'none';
  }

  function selectSat(entity) {
    selectedEntity = entity;
    refreshFeatures();
    if (trueScaleOn && entity) enterTrueScale(entity);
  }

  // ── True scale — orbit camera ──────────────────────────────────────────────
  // Every frame: recompute camera position from spherical parameters so the
  // camera stays in the satellite's reference frame automatically.
  viewer.scene.preRender.addEventListener(() => {
    if (!trueScaleOn || !selectedEntity) return;
    const satPos = selectedEntity.position.getValue(viewer.clock.currentTime);
    if (!satPos) return;

    const frame = satLocalFrame(satPos);
    const sinEl = Math.sin(camElevation);
    const cosEl = Math.cos(camElevation);
    const sinAz = Math.sin(camAzimuth);
    const cosAz = Math.cos(camAzimuth);

    // Camera offset from satellite in local frame
    const offE = camDist * cosEl * sinAz;
    const offN = camDist * cosEl * cosAz;
    const offU = camDist * sinEl;

    // Camera look direction: toward satellite centre
    const dirE = -cosEl * sinAz;
    const dirN = -cosEl * cosAz;
    const dirU = -sinEl;

    // Camera up: tangent to the elevation arc — stays smooth at all angles,
    // no singularity except at ±90° (clamped away from those)
    const upE = -sinEl * sinAz;
    const upN = -sinEl * cosAz;
    const upU =  cosEl;

    const camPos  = Cesium.Cartesian3.add(satPos, localToECEF(offE, offN, offU, frame), new Cesium.Cartesian3());
    const dirECEF = localToECEF(dirE, dirN, dirU, frame);
    const upECEF  = localToECEF(upE,  upN,  upU,  frame);

    viewer.camera.setView({ destination: camPos, orientation: { direction: dirECEF, up: upECEF } });
  });

  // Mouse drag — orbit around the satellite
  viewer.scene.canvas.addEventListener('mousedown', e => {
    if (!trueScaleOn) return;
    mouseDown  = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });
  document.addEventListener('mousemove', e => {
    if (!trueScaleOn || !mouseDown) return;
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    camAzimuth   -= dx * 0.004;
    camElevation  = Math.max(-Math.PI / 2 + 0.05,
                    Math.min( Math.PI / 2 - 0.05, camElevation - dy * 0.004));
  });
  document.addEventListener('mouseup', () => { mouseDown = false; });

  // Scroll — zoom in / out
  viewer.scene.canvas.addEventListener('wheel', e => {
    if (!trueScaleOn) return;
    camDist = Math.max(2, Math.min(5000, camDist * Math.pow(1.1, e.deltaY / 100)));
    e.preventDefault();
  }, { passive: false });

  function enterTrueScale(entity) {
    savedCamPos    = viewer.camera.position.clone();
    savedCamOrient = { heading: viewer.camera.heading,
                       pitch:   viewer.camera.pitch,
                       roll:    viewer.camera.roll };

    // Reset orbit parameters for this satellite
    camAzimuth   = 0;
    camElevation = Math.PI / 4;
    camDist      = 15;

    // White box placeholder at satellite's position
    if (satBoxEntity) { viewer.entities.remove(satBoxEntity); satBoxEntity = null; }
    satBoxEntity = viewer.entities.add({
      position:    entity.position,
      orientation: new Cesium.VelocityOrientationProperty(entity.position),
      box: {
        dimensions:   new Cesium.Cartesian3(3, 1.5, 1.5),
        material:     Cesium.Color.WHITE.withAlpha(0.95),
        outline:      true,
        outlineColor: Cesium.Color.LIGHTGRAY,
      }
    });

    try { viewer.scene.camera.frustum.near = 0.1; } catch (_) {}

    // Disable all built-in Cesium camera controls — preRender drives position
    ctrl.enableRotate    = false;
    ctrl.enableZoom      = false;
    ctrl.enableTilt      = false;
    ctrl.enableLook      = false;
    ctrl.enableTranslate = false;
  }

  function exitTrueScale() {
    trueScaleOn = false;
    document.getElementById('btnTrueScale').classList.remove('on');
    document.getElementById('scaleTxt').style.display = 'none';

    if (satBoxEntity) { viewer.entities.remove(satBoxEntity); satBoxEntity = null; }

    ctrl.enableRotate    = true;
    ctrl.enableZoom      = true;
    ctrl.enableTilt      = true;
    ctrl.enableLook      = false;
    ctrl.enableTranslate = true;

    if (savedCamPos) {
      viewer.camera.flyTo({ destination: savedCamPos,
                            orientation: savedCamOrient, duration: 1.5 });
      savedCamPos = savedCamOrient = null;
    }
  }

  function toggleTrueScale() {
    if (!selectedEntity) return;
    trueScaleOn = !trueScaleOn;
    document.getElementById('btnTrueScale').classList.toggle('on', trueScaleOn);
    document.getElementById('scaleTxt').style.display = trueScaleOn ? 'block' : 'none';
    if (trueScaleOn) enterTrueScale(selectedEntity);
    else             exitTrueScale();
  }

  // ── Data loading ───────────────────────────────────────────────────────────
  fetch("/api/czml").then(r => r.json())
    .then(czml => Cesium.CzmlDataSource.load(czml))
    .then(ds => {
      satDS = ds;
      viewer.dataSources.add(ds);
      viewer.clock.shouldAnimate = true;

      ds.entities.values.forEach(entity => {
        if (!entity.position) return;
        satEntities.push(entity);

        tetherEntities.push(viewer.entities.add({
          show: false,
          polyline: {
            positions: new Cesium.CallbackProperty(t => {
              const pos = entity.position.getValue(t);
              if (!pos) return [];
              const c = Cesium.Cartographic.fromCartesian(pos);
              return [pos, Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, 0)];
            }, false),
            width: 1,
            material: Cesium.Color.CYAN.withAlpha(0.22),
          }
        }));

        coverageEntities.push(viewer.entities.add({
          show: false,
          position: new Cesium.CallbackProperty(t => {
            const pos = entity.position.getValue(t);
            if (!pos) return Cesium.Cartesian3.ZERO;
            const c = Cesium.Cartographic.fromCartesian(pos);
            return Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, 0);
          }, false),
          ellipse: {
            semiMajorAxis: COVERAGE_RADIUS,
            semiMinorAxis: COVERAGE_RADIUS,
            material: Cesium.Color.CYAN.withAlpha(0.12),
            outline: true,
            outlineColor: Cesium.Color.CYAN.withAlpha(0.7),
            outlineWidth: 2,
            height: 0,
          }
        }));
      });
    });

  // ── Click — select / deselect ──────────────────────────────────────────────
  const clickH = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  clickH.setInputAction(e => {
    if (mouseDown) return; // ignore if we were dragging
    const picked = viewer.scene.pick(e.position);
    if (Cesium.defined(picked) && picked.id && picked.id.position) {
      selectSat(picked.id === selectedEntity ? null : picked.id);
    } else if (!trueScaleOn) {
      selectSat(null);
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // ── Clock tick — live panels for selected satellite ────────────────────────
  viewer.clock.onTick.addEventListener(() => {
    if (!selectedEntity) return;
    const pos = selectedEntity.position.getValue(viewer.clock.currentTime);
    if (!pos) return;
    const carto = Cesium.Cartographic.fromCartesian(pos);

    if (hoverOn) {
      const screenPos = viewer.scene.cartesianToCanvasCoordinates(pos);
      if (Cesium.defined(screenPos)) {
        const alt = Math.round(carto.height / 1000);
        tip.innerHTML = `<b>${selectedEntity.name}</b>`
          + `<br>Alt: ${alt.toLocaleString()} km`
          + `<br><span style="color:#8ad">${Math.round(alt / 10.7)}× cruising altitude</span>`;
        tip.style.display = 'block';
        tip.style.left = (screenPos.x + 18) + 'px';
        tip.style.top  = screenPos.y + 'px';
      } else {
        tip.style.display = 'none';
      }
    }

    if (pulseOn) {
      const alt = Math.round(carto.height / 1000);
      const ms  = Math.round(alt / 299.792);
      pulsePnl.innerHTML = `<b>${selectedEntity.name}</b>  ⚡ ~${ms} ms to Earth`
        + `<br><span style="color:#aaa;font-size:11px">${alt.toLocaleString()} km ÷ 299,792 km/s</span>`;
      pulsePnl.style.display = 'block';
    }
  });

  // ── Feature toggles ────────────────────────────────────────────────────────
  function toggleHover() {
    hoverOn = !hoverOn;
    document.getElementById('btnHover').classList.toggle('on', hoverOn);
    if (!hoverOn) tip.style.display = 'none';
  }

  function toggleTethers() {
    tethersOn = !tethersOn;
    document.getElementById('btnTether').classList.toggle('on', tethersOn);
    refreshFeatures();
  }

  function togglePulse() {
    pulseOn = !pulseOn;
    document.getElementById('btnPulse').classList.toggle('on', pulseOn);
    if (!pulseOn) pulsePnl.style.display = 'none';
    refreshFeatures();
  }

  let issDS = null;
  function toggleISS() {
    issOn = !issOn;
    document.getElementById('btnISS').classList.toggle('on', issOn);
    if (issOn && !issDS) {
      fetch('/api/iss').then(r => r.json())
        .then(czml => Cesium.CzmlDataSource.load(czml))
        .then(ds => { issDS = ds; viewer.dataSources.add(ds); });
    } else if (issDS) {
      issDS.show = issOn;
    }
  }

  function toggleCoverage() {
    coverageOn = !coverageOn;
    document.getElementById('btnCoverage').classList.toggle('on', coverageOn);
    refreshFeatures();
  }
</script>
</body>
</html>
